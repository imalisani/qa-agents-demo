name: Quality pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: qa_lab
          POSTGRES_USER: qa_lab
          POSTGRES_PASSWORD: qa_lab_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_lab -d qa_lab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://qa_lab:qa_lab_ci@127.0.0.1:5432/qa_lab
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare isolated evidence directories
        run: npm run evidence:prepare
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests and branch coverage (minimum 90%)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:unit
      - name: Functional API, UI and accessibility tests
        id: functional
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:functional
      - name: PostgreSQL data-integrity tests
        id: data
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:data
      - name: Simulated provider integration and resilience tests
        id: integration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:integration
      - name: Security-focused tests
        id: security
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:security
      - name: Install Grafana k6
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: grafana/setup-k6-action@v1
      - name: Start service for performance smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          node app/server.mjs > reports/performance-server.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/health && exit 0
            sleep 1
          done
          exit 1
      - name: k6 performance smoke guardrail
        id: performance
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:performance:smoke
      - name: Generate unified QA Evidence Pack
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          REQUIRED_EVIDENCE: unit,functional,integration,security,data,performance
        run: npm run evidence:generate
      - name: Generate fresh Allure report, including failed tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run allure:generate
      - name: Save execution evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qa-evidence-${{ github.run_id }}
          retention-days: 14
          path: |
            reports/playwright-functional/
            reports/playwright-integration/
            reports/playwright-security/
            reports/playwright-data/
            reports/allure-current/
            reports/performance-server.log
            allure-results/current/
            evidence/qa-evidence.json
            evidence/raw/
            test-results/
      - name: Prepare successful main report for publication
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: reports/allure-current

  deploy:
    name: Publish verified report
    needs: quality
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  smoke:
    name: Published report smoke test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPORT_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify visible suites and commit provenance
        run: npm run test:deploy
      - name: Save deployment verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deployment-evidence-${{ github.run_id }}
          retention-days: 14
          path: |
            reports/deployment-html/
            test-results-deploy/
