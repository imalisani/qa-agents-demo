name: Quality pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests and branch coverage (minimum 90%)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p reports
          npm run test:unit 2>&1 | tee reports/unit-tests.txt
      - name: API, UI and accessibility tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Generate fresh Allure report, including failed tests
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: npm run allure:generate
      - name: Save execution evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ github.run_id }}
          retention-days: 14
          path: |
            reports/unit-tests.txt
            reports/playwright-html/
            reports/allure-current/
            allure-results/current/
            evidence/execution-results.json
            test-results/
      - name: Prepare successful main report for publication
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-current

  deploy:
    name: Publish verified report
    needs: quality
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Published report smoke test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPORT_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify visible suites and commit provenance
        run: npm run test:deploy
      - name: Save deployment verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.run_id }}
          retention-days: 14
          path: |
            reports/deployment-html/
            test-results-deploy/
